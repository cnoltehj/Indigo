version: "3.9"

services:
  claims-api:
    build:
      context: .
      dockerfile: src/Indigo.Claims.Api/Dockerfile
    container_name: indigo-claims-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ClaimsDatabase: >
        Server=sqlserver,1433;
        Database=IndigoClaims;
        User Id=sa;
        Password=${SQL_SA_PASSWORD};
        TrustServerCertificate=True;
        Encrypt=False
      ClaimsApi__ApiKey: ${CLAIMS_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - indigo-network
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: indigo-claims-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - indigo-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - indigo-network
    restart: unless-stopped

networks:
  indigo-network:
    driver: bridge

volumes:
  indigo-sql-data:
